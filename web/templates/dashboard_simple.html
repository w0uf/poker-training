<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 Poker Training - Dashboard Simple</title>
    <link rel="stylesheet" href="/static/poker.css">
    <style>
        body { padding: 20px; }

        .page-title {
            color: var(--gold-light);
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav a {
            color: var(--text-muted);
            text-decoration: none;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav a:hover {
            color: var(--text-bright);
            background: rgba(255,255,255,0.1);
        }

        .nav button {
            background: rgba(201,168,76,0.15);
            color: var(--gold-light);
            border: 1px solid var(--gold-dim);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav button:hover {
            background: rgba(201,168,76,0.25);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 20px;
            margin: 15px 0;
            border: 1px solid var(--glass-border);
            border-top: 2px solid var(--gold-dim);
        }

        .card h2 {
            color: var(--gold-light);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }

        .stat {
            text-align: center;
            padding: 20px 15px;
            background: rgba(0,0,0,0.25);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold-light);
        }

        .stat div:last-child {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }

        .error {
            background: rgba(192, 57, 43, 0.15);
            color: var(--wrong-color);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(192, 57, 43, 0.3);
            margin: 8px 0;
        }

        .debug {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            color: #c9a84c;
            border: 1px solid var(--glass-border);
        }

        .import-row, .context-row {
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .import-row:last-child, .context-row:last-child { border-bottom: none; }

        .import-row strong, .context-row strong {
            color: var(--text-bright);
            display: block;
            margin-bottom: 2px;
        }

        .import-row small, .context-row small { font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">🃏 Poker Training Dashboard - Mode Debug</h1>

        <div class="nav">
            <a href="/">Dashboard</a>
            <button onclick="runAllTests()">🧪 Test Toutes les APIs</button>
            <button onclick="loadSimpleData()">📊 Charger Données</button>
        </div>

        <div class="card">
            <h2>📊 Statistiques</h2>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="files">?</div>
                    <div>Fichiers</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="contexts">?</div>
                    <div>Contextes</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="ranges">?</div>
                    <div>Ranges</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="hands">?</div>
                    <div>Mains</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📥 Imports Récents</h2>
            <div id="imports">
                <div class="loading">Chargement...</div>
            </div>
        </div>

        <div class="card">
            <h2>📋 Contextes</h2>
            <div id="contexts-list">
                <div class="loading">Chargement...</div>
            </div>
        </div>

        <div class="card">
            <h2>🔧 Debug Console</h2>
            <div id="debug-output" class="debug">Cliquez sur "Test Toutes les APIs" pour commencer...</div>
        </div>
    </div>

    <script>
        let debugOutput = document.getElementById('debug-output');

        function log(message) {
            console.log(message);
            debugOutput.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            debugOutput.scrollTop = debugOutput.scrollHeight;
        }

        async function runAllTests() {
            debugOutput.textContent = '';
            log('🚀 Début des tests...');

            try {
                log('📁 Test des chemins...');
                const pathsResponse = await fetch('/api/debug/paths');
                const paths = await pathsResponse.json();
                log('✅ Chemins OK: ' + JSON.stringify(paths, null, 2));
            } catch (error) {
                log('❌ Erreur chemins: ' + error.message);
            }

            try {
                log('🗄️ Test base de données...');
                const dbResponse = await fetch('/api/debug/db');
                const dbData = await dbResponse.json();
                log('✅ Base OK - Tables: ' + dbData.tables.join(', '));
                log('📊 Comptages: ' + JSON.stringify(dbData.data, null, 2));
            } catch (error) {
                log('❌ Erreur base: ' + error.message);
            }

            try {
                log('📊 Test API stats...');
                const statsResponse = await fetch('/api/dashboard/stats');
                if (statsResponse.ok) {
                    const stats = await statsResponse.json();
                    log('✅ Stats OK: ' + JSON.stringify(stats, null, 2));
                    updateSimpleStats(stats);
                } else {
                    const errorText = await statsResponse.text();
                    log('❌ Stats erreur HTTP ' + statsResponse.status + ': ' + errorText);
                }
            } catch (error) {
                log('❌ Erreur stats: ' + error.message);
            }

            try {
                log('📋 Test API contexts...');
                const contextsResponse = await fetch('/api/dashboard/contexts');
                if (contextsResponse.ok) {
                    const contexts = await contextsResponse.json();
                    log('✅ Contexts OK: ' + contexts.length + ' contextes trouvés');
                    updateSimpleContexts(contexts);
                } else {
                    const errorText = await contextsResponse.text();
                    log('❌ Contexts erreur HTTP ' + contextsResponse.status + ': ' + errorText);
                }
            } catch (error) {
                log('❌ Erreur contexts: ' + error.message);
            }

            log('🎉 Tests terminés!');
        }

        async function loadSimpleData() {
            log('📊 Chargement des données simples...');

            try {
                const dbResponse = await fetch('/api/debug/db');
                const dbData = await dbResponse.json();

                if (dbData.data) {
                    document.getElementById('files').textContent = dbData.data.range_files || 0;
                    document.getElementById('contexts').textContent = dbData.data.range_contexts || 0;
                    document.getElementById('ranges').textContent = dbData.data.ranges || 0;
                    document.getElementById('hands').textContent = dbData.data.range_hands || 0;
                    log('✅ Stats mises à jour depuis debug DB');
                }

                if (dbData.recent_imports_test) {
                    const importsHtml = dbData.recent_imports_test.map(imp => `
                        <div class="import-row">
                            <strong>${imp.context_name || imp.filename}</strong>
                            <small>${imp.filename} • ${imp.imported_at} • ${Math.round((imp.confidence || 0) * 100)}%</small>
                        </div>
                    `).join('');
                    document.getElementById('imports').innerHTML = importsHtml;
                    log('✅ Imports récents affichés');
                }

                if (dbData.range_contexts_examples) {
                    const contextsHtml = dbData.range_contexts_examples.map(ctx => `
                        <div class="context-row">
                            <strong>${ctx.name}</strong>
                            <small>ID: ${ctx.id} • Confiance: ${Math.round((ctx.confidence || 0) * 100)}%</small>
                        </div>
                    `).join('');
                    document.getElementById('contexts-list').innerHTML = contextsHtml;
                    log('✅ Contextes affichés');
                }

            } catch (error) {
                log('❌ Erreur chargement simple: ' + error.message);
            }
        }

        function updateSimpleStats(stats) {
            document.getElementById('files').textContent = stats.total_files || 0;
            document.getElementById('contexts').textContent = stats.total_contexts || 0;
            document.getElementById('ranges').textContent = stats.total_ranges || 0;
            document.getElementById('hands').textContent = stats.total_hands || 0;

            if (stats.recent_imports && stats.recent_imports.length > 0) {
                const importsHtml = stats.recent_imports.map(imp => `
                    <div class="import-row">
                        <strong>${imp.context_name || imp.filename}</strong>
                        <small>${imp.filename} • ${imp.imported_at} • ${Math.round((imp.confidence || 0) * 100)}%</small>
                    </div>
                `).join('');
                document.getElementById('imports').innerHTML = importsHtml;
            }
        }

        function updateSimpleContexts(contexts) {
            if (contexts && contexts.length > 0) {
                const contextsHtml = contexts.map(ctx => `
                    <div class="context-row">
                        <strong>${ctx.name}</strong>
                        <small>
                            ${ctx.hero_position || '-'} • ${ctx.primary_action || '-'} •
                            ${Math.round((ctx.confidence || 0) * 100)}% •
                            ${ctx.ranges_count} ranges, ${ctx.hands_count} mains
                        </small>
                    </div>
                `).join('');
                document.getElementById('contexts-list').innerHTML = contextsHtml;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Dashboard simple chargé');
            loadSimpleData();
        });
    </script>
</body>
</html>
