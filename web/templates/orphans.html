<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des fichiers manquants - Poker Training</title>
    <link rel="stylesheet" href="/static/poker.css">
    <style>
        body { padding: 20px; }

        .page-header {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 30px;
            border: 1px solid var(--glass-border);
            border-top: 2px solid var(--gold-dim);
            margin-bottom: 20px;
        }

        .page-header h1 {
            color: var(--gold-light);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .alert-banner {
            background: rgba(255, 183, 0, 0.08);
            border: 1px solid rgba(255, 183, 0, 0.3);
            border-left: 4px solid #FFB300;
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 20px;
        }

        .alert-title {
            color: #FFB300;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .alert-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .no-orphans {
            background: var(--bg-card);
            padding: 60px 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            border: 1px solid var(--glass-border);
            border-top: 2px solid rgba(30, 132, 73, 0.5);
        }

        .no-orphans h2 {
            color: var(--correct-color);
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .no-orphans p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .orphan-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 25px;
            margin-bottom: 15px;
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--wrong-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .orphan-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .orphan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .orphan-title { flex: 1; }

        .orphan-title h3 {
            color: var(--text-bright);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .orphan-filename {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--glass-border);
            display: inline-block;
        }

        .orphan-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-weight: 600;
            color: var(--gold-light);
        }

        .orphan-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 140px;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-ignore {
            background: rgba(255,255,255,0.07);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }

        .btn-ignore:hover:not(:disabled) {
            background: rgba(255,255,255,0.12);
            color: var(--text-bright);
        }

        .btn-delete {
            background: rgba(192, 57, 43, 0.15);
            color: var(--wrong-color);
            border: 1px solid rgba(192, 57, 43, 0.3);
        }

        .btn-delete:hover:not(:disabled) {
            background: rgba(192, 57, 43, 0.25);
        }

        .btn-rebuild {
            background: rgba(36, 113, 163, 0.2);
            color: #5dade2;
            border: 1px solid rgba(36, 113, 163, 0.35);
        }

        .btn-rebuild:hover:not(:disabled) {
            background: rgba(36, 113, 163, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-dim) 0%, rgba(201,168,76,0.2) 100%);
            color: var(--gold-light);
            border: 1px solid var(--gold-dim);
            padding: 12px 30px;
            flex: none;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 14px rgba(201, 168, 76, 0.2);
            transform: translateY(-1px);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .message {
            padding: 15px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 15px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: rgba(30, 132, 73, 0.15);
            color: var(--correct-color);
            border: 1px solid rgba(30, 132, 73, 0.3);
        }

        .message.error {
            background: rgba(192, 57, 43, 0.15);
            color: var(--wrong-color);
            border: 1px solid rgba(192, 57, 43, 0.3);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bottom-actions {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius-md);
            text-align: center;
            margin-top: 20px;
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>🔍 Gestion des fichiers manquants</h1>
            <p>
                Les contextes ci-dessous ont été importés dans la base de données,
                mais leurs fichiers JSON sources sont introuvables.
                Vous pouvez les ignorer, les supprimer ou reconstruire les fichiers depuis la base.
            </p>
        </div>

        <div id="message-container"></div>

        <div id="content">
            <div class="loading">
                ⏳ Vérification des fichiers en cours...
            </div>
        </div>

        <div class="bottom-actions">
            <button class="btn btn-primary" onclick="window.location.href='/'">
                ← Retour au dashboard
            </button>
        </div>
    </div>

    <script>
        let orphans = [];

        async function loadOrphans() {
            try {
                const response = await fetch('/api/orphans/check');
                const data = await response.json();

                orphans = data.orphans || [];
                renderOrphans();

            } catch (error) {
                console.error('Erreur chargement:', error);
                showMessage('Erreur lors du chargement des fichiers manquants', 'error');
            }
        }

        function renderOrphans() {
            const content = document.getElementById('content');

            if (orphans.length === 0) {
                content.innerHTML = `
                    <div class="no-orphans">
                        <h2>✅ Aucun fichier manquant</h2>
                        <p>Tous vos contextes ont leurs fichiers JSON sources présents.</p>
                        <button class="btn btn-primary" onclick="window.location.href='/'">
                            Retour au dashboard
                        </button>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="alert-banner">
                    <div class="alert-title">⚠️ ${orphans.length} fichier(s) manquant(s) détecté(s)</div>
                    <div class="alert-text">
                        Pour chaque contexte, vous pouvez :
                        <ul style="margin-top: 10px; margin-left: 20px;">
                            <li><strong style="color: var(--text-bright);">Ignorer</strong> : Ne rien faire (vous pourrez toujours agir plus tard)</li>
                            <li><strong style="color: var(--text-bright);">Supprimer</strong> : Retirer définitivement de la base de données</li>
                            <li><strong style="color: var(--text-bright);">Reconstruire</strong> : Créer un nouveau fichier JSON depuis les données en base</li>
                        </ul>
                    </div>
                </div>

                <div id="orphans-list">
                    ${orphans.map(renderOrphanCard).join('')}
                </div>
            `;
        }

        function renderOrphanCard(orphan) {
            return `
                <div class="orphan-card" id="orphan-${orphan.context_id}">
                    <div class="orphan-header">
                        <div class="orphan-title">
                            <h3>${orphan.name}</h3>
                            <span class="orphan-filename">${orphan.filename}</span>
                        </div>
                    </div>

                    <div class="orphan-stats">
                        <div class="stat">
                            📊 <span class="stat-value">${orphan.ranges_count}</span> ranges
                        </div>
                        <div class="stat">
                            🃏 <span class="stat-value">${orphan.hands_count}</span> mains
                        </div>
                    </div>

                    <div class="orphan-actions">
                        <button class="btn btn-ignore" onclick="handleIgnore(${orphan.context_id})">
                            👁️ Ignorer
                        </button>
                        <button class="btn btn-delete" onclick="handleDelete(${orphan.context_id})">
                            🗑️ Supprimer
                        </button>
                        <button class="btn btn-rebuild" onclick="handleRebuild(${orphan.context_id})">
                            🔄 Reconstruire JSON
                        </button>
                    </div>
                </div>
            `;
        }

        async function handleIgnore(contextId) {
            try {
                const response = await fetch(`/api/orphans/ignore/${contextId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('Contexte ignoré', 'success');
                    removeOrphanCard(contextId);
                }
            } catch (error) {
                showMessage('Erreur lors de l\'opération', 'error');
            }
        }

        async function handleDelete(contextId) {
            if (!confirm('⚠️ ATTENTION : Cette action supprimera définitivement ce contexte de la base.\n\nToutes les ranges et mains associées seront perdues.\n\nÊtes-vous sûr ?')) {
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Suppression...';

            try {
                const response = await fetch(`/api/orphans/delete/${contextId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('✅ Contexte supprimé de la base', 'success');
                    removeOrphanCard(contextId);
                } else {
                    showMessage(`❌ ${result.message}`, 'error');
                    btn.disabled = false;
                    btn.textContent = '🗑️ Supprimer';
                }
            } catch (error) {
                showMessage('Erreur lors de la suppression', 'error');
                btn.disabled = false;
                btn.textContent = '🗑️ Supprimer';
            }
        }

        async function handleRebuild(contextId) {
            if (!confirm('Reconstruire le fichier JSON depuis la base de données ?\n\nUn nouveau fichier sera créé avec les données actuelles.')) {
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Reconstruction...';

            try {
                const response = await fetch(`/api/orphans/rebuild/${contextId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const result = await response.json();

                if (result.success) {
                    showMessage(`✅ ${result.message}`, 'success');
                    removeOrphanCard(contextId);
                } else {
                    showMessage(`❌ ${result.message}`, 'error');
                    btn.disabled = false;
                    btn.textContent = '🔄 Reconstruire JSON';
                }
            } catch (error) {
                showMessage('Erreur lors de la reconstruction', 'error');
                btn.disabled = false;
                btn.textContent = '🔄 Reconstruire JSON';
            }
        }

        function removeOrphanCard(contextId) {
            const card = document.getElementById(`orphan-${contextId}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    card.remove();

                    // Retirer de la liste
                    orphans = orphans.filter(o => o.context_id !== contextId);

                    // Si plus d'orphelins, afficher le message de succès
                    if (orphans.length === 0) {
                        renderOrphans();
                    }
                }, 300);
            }
        }

        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            container.appendChild(msg);

            setTimeout(() => {
                msg.style.opacity = '0';
                setTimeout(() => msg.remove(), 300);
            }, 3000);
        }

        // Charger au démarrage
        loadOrphans();
    </script>
</body>
</html>
