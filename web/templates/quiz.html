<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Poker Training</title>
    <link rel="stylesheet" href="/static/poker.css">
    <style>
        /* ---- Header ---- */
        .quiz-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 20px;
            margin-bottom: 20px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            backdrop-filter: blur(12px);
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
            transition: width 0.4s ease;
            border-radius: 3px;
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .progress-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-bright);
            white-space: nowrap;
            min-width: 110px;
            text-align: right;
        }

        .score-chip {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 99px;
            background: var(--gold-dim);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            white-space: nowrap;
        }

        /* ---- Context card (HUD) ---- */
        .context-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-top: 2px solid var(--gold-dim);
            border-radius: var(--radius-md);
            padding: 14px 20px;
            margin-bottom: 18px;
            backdrop-filter: blur(12px);
        }

        .context-info {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .info-badge {
            padding: 5px 13px;
            border-radius: 99px;
            font-size: 0.82rem;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-bright);
        }

        .info-badge.highlight {
            background: rgba(201, 168, 76, 0.14);
            border-color: var(--gold-dim);
            color: var(--gold-light);
        }

        /* ---- Table de poker ---- */
        .poker-table {
            position: relative;
            background: radial-gradient(ellipse at 50% 40%, var(--felt-center) 0%, #145229 50%, var(--felt-edge) 100%);
            border-radius: 160px / 100px;
            padding: 50px 60px;
            margin-bottom: 20px;
            border: 10px solid var(--rail-dark);
            box-shadow:
                0 0 0 3px var(--rail-light),
                0 24px 70px rgba(0,0,0,0.75),
                inset 0 0 80px rgba(0,0,0,0.35),
                inset 0 0 12px rgba(255,255,255,0.03);
        }

        .poker-table::before {
            content: '';
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 150px / 90px;
            pointer-events: none;
        }

        /* ---- Zone de question ---- */
        .question-zone {
            text-align: center;
            padding: 20px 10px;
            position: relative;
            z-index: 2;
        }

        .situation-text {
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.7;
            color: var(--text-bright);
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            margin-bottom: 10px;
            letter-spacing: 0.01em;
        }

        /* ---- Variante ---- */
        .question-variant {
            display: inline-block;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            margin-bottom: 16px;
            font-style: italic;
            font-size: 0.9rem;
            color: rgba(240,235,224,0.75);
        }

        .question-variant::before {
            content: "Variante : ";
            font-weight: 700;
            font-style: normal;
            color: var(--gold-light);
        }

        /* ---- Drill-down séquence ---- */
        .quiz-action-sequence {
            margin-bottom: 16px;
            padding: 12px 16px;
            background: rgba(201, 168, 76, 0.08);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--gold);
        }

        .quiz-action-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            white-space: nowrap;
        }

        .quiz-action-raise { background: rgba(202,111,30,0.85); color: #fff; }
        .quiz-action-call  { background: rgba(36,113,163,0.85); color: #fff; }
        .quiz-action-fold  { background: rgba(192,57,43,0.85);  color: #fff; }
        .quiz-action-check { background: rgba(30,132,73,0.85);  color: #fff; }

        .quiz-action-arrow {
            color: rgba(255,255,255,0.5);
            font-weight: bold;
            font-size: 14px;
        }

        /* ---- Cartes CSS ---- */
        #handDisplay {
            position: relative;
            min-height: 148px;
            margin: 18px 0 28px;
            display: flex;
            justify-content: center;
            gap: 0;
        }

        .card-slot {
            width: 96px;
            height: 134px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .card-slot + .card-slot { margin-left: -32px; }

        .playing-card {
            position: absolute;
            width: 96px;
            height: 134px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.12);
            box-shadow: 0 4px 14px rgba(0,0,0,0.45), 0 1px 4px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 7px 9px;
            font-family: 'Georgia', 'Times New Roman', serif;
            user-select: none;
            z-index: 10;
            overflow: hidden;
        }

        .card-corner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1;
            gap: 1px;
        }

        .card-corner-bottom {
            align-self: flex-end;
            transform: rotate(180deg);
        }

        .card-rank {
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .card-suit-small {
            font-size: 0.85rem;
            line-height: 1;
        }

        .card-center-suit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.4rem;
            line-height: 1;
            opacity: 0.9;
        }

        .card-red   { color: #c0392b; }
        .card-black { color: #111; }

        .playing-card.from-center {
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) scale(0.2) rotate(var(--deal-rot, -4deg));
            opacity: 0;
            filter: blur(2px);
        }

        .playing-card.to-slot {
            transform: translate(0, 0) scale(1) rotate(var(--deal-rot, 0deg));
            opacity: 1;
            filter: none;
            transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1),
                        opacity 0.3s ease-out,
                        filter 0.3s ease-out;
        }

        .playing-card.arrived {
            box-shadow: 0 8px 28px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.25);
        }

        /* ---- Boutons d'action ---- */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
            pointer-events: auto;
        }

        .action-btn {
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            min-width: 130px;
            position: relative;
            z-index: 11;
            pointer-events: auto;
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-4px);
        }

        .action-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(0.3);
        }

        .btn-fold {
            background: linear-gradient(160deg, #a93226 0%, var(--fold-color) 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(192,57,43,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-fold:hover:not(:disabled) {
            box-shadow: 0 8px 28px rgba(192,57,43,0.65), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .btn-call {
            background: linear-gradient(160deg, #1a5276 0%, var(--call-color) 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(36,113,163,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-call:hover:not(:disabled) {
            box-shadow: 0 8px 28px rgba(36,113,163,0.65), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .btn-check {
            background: linear-gradient(160deg, #145229 0%, var(--check-color) 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(30,132,73,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-check:hover:not(:disabled) {
            box-shadow: 0 8px 28px rgba(30,132,73,0.65), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .btn-raise, .btn-open {
            background: linear-gradient(160deg, #935116 0%, var(--raise-color) 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(202,111,30,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-raise:hover:not(:disabled), .btn-open:hover:not(:disabled) {
            box-shadow: 0 8px 28px rgba(202,111,30,0.65), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* ---- Feedback ---- */
        .feedback {
            margin-top: 24px;
            padding: 22px 26px;
            border-radius: var(--radius-md);
            font-size: 1rem;
            display: none;
            animation: slideUp 0.25s ease-out;
            position: relative;
            z-index: 15;
            border: 1px solid transparent;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: linear-gradient(135deg, rgba(20,82,41,0.96) 0%, rgba(30,132,73,0.96) 100%);
            border-color: rgba(46,204,113,0.4);
            color: #fff;
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, rgba(120,36,29,0.96) 0%, rgba(192,57,43,0.96) 100%);
            border-color: rgba(231,76,60,0.4);
            color: #fff;
        }

        .feedback-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .next-btn {
            margin-top: 16px;
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: 700;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
            position: relative;
            z-index: 20;
            pointer-events: auto;
            letter-spacing: 0.5px;
        }

        .next-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.03);
        }

        /* ---- Loading ---- */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* ---- Résultats (scores de performance) ---- */
        .results-score-big {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 15px 0;
        }
        .results-score-big.excellent { color: #2ecc71; }
        .results-score-big.good      { color: #7cb342; }
        .results-score-big.average   { color: #f39c12; }
        .results-score-big.poor      { color: #e67e22; }
        .results-score-big.bad       { color: #e74c3c; }

        .results-section, .analysis-section {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 18px;
            text-align: left;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-stats, .context-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .context-card-result {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid;
        }
        .context-card-result.excellent { border-color: #2ecc71; }
        .context-card-result.good      { border-color: #7cb342; }
        .context-card-result.average   { border-color: #f39c12; }
        .context-card-result.poor      { border-color: #e67e22; }
        .context-card-result.bad       { border-color: #e74c3c; }

        .context-name  { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
        .context-score { font-size: 2rem; font-weight: 800; }
        .context-details { font-size: 0.82rem; opacity: 0.7; margin-top: 4px; }

        .errors-list { display: flex; flex-direction: column; gap: 10px; }

        .error-item {
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius-sm);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--fold-color);
        }

        .error-hand         { font-size: 1.1rem; font-weight: 700; color: var(--gold-light); }
        .error-context      { font-size: 0.78rem; opacity: 0.65; margin-top: 3px; }
        .error-actions      { text-align: right; }
        .error-your-answer  { font-size: 0.82rem; color: #e74c3c; }
        .error-correct-answer { font-size: 0.9rem; color: #2ecc71; font-weight: 600; margin-top: 3px; }

        .recommendations { display: flex; flex-direction: column; gap: 10px; }

        .recommendation-item {
            background: rgba(201, 168, 76, 0.07);
            border-radius: var(--radius-sm);
            padding: 14px;
            border-left: 3px solid var(--gold);
        }

        .recommendation-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--gold-light);
        }

        .recommendation-text { font-size: 0.9rem; line-height: 1.5; color: var(--text-bright); }

        .results-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .results-btn {
            padding: 13px 30px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            letter-spacing: 0.5px;
        }
        .results-btn:hover { transform: translateY(-3px); }

        .btn-retry {
            background: linear-gradient(135deg, #145229, var(--check-color));
            color: #fff;
            box-shadow: 0 4px 16px rgba(30,132,73,0.4);
        }
        .btn-home {
            background: linear-gradient(135deg, #1a5276, var(--call-color));
            color: #fff;
            box-shadow: 0 4px 16px rgba(36,113,163,0.4);
        }
        .btn-export {
            background: linear-gradient(135deg, #145229, #27ae60);
            color: #fff;
            box-shadow: 0 4px 16px rgba(39,174,96,0.4);
        }

        .results-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-top: 2px solid var(--gold-dim);
            color: var(--text-bright);
            padding: 36px;
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
        }

        .results-title {
            font-size: 2rem;
            margin-bottom: 16px;
            color: var(--gold-light);
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 18px;
            margin: 26px 0;
        }

        .stat-item {
            padding: 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold-light);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .results-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Header avec progression -->
        <div class="quiz-header">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="progress-text">
                Q&nbsp;<span id="currentQuestion">0</span>&nbsp;/&nbsp;<span id="totalQuestions">0</span>
            </div>
            <div class="score-chip">
                <span id="correctCount">0</span> pts
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Préparation du quiz…</p>
        </div>

        <!-- Zone de jeu -->
        <div id="quizZone" style="display: none;">

            <!-- Contexte (HUD) -->
            <div class="context-card">
                <div class="context-info" id="contextInfo"></div>
            </div>

            <!-- Table de poker -->
            <div class="poker-table">
                <div class="question-zone">

                    <!-- Variante -->
                    <div id="questionVariant" class="question-variant" style="display: none;"></div>

                    <!-- Séquence d'actions (drill-down) -->
                    <div id="actionSequence" class="quiz-action-sequence" style="display: none;"></div>

                    <div class="situation-text" id="situationText"></div>

                    <div id="handDisplay"></div>

                    <div class="action-buttons" id="actionButtons"></div>

                    <div class="feedback" id="feedback">
                        <div class="feedback-title" id="feedbackTitle"></div>
                        <div id="feedbackText"></div>
                        <button class="next-btn" id="nextBtn">Continuer →</button>
                    </div>

                </div>
            </div>

        </div><!-- /quizZone -->

    </div><!-- /container -->

    <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let questions = [];
        let currentQuestionIndex = 0;
        let currentQuestionNum = 1;
        let correctAnswers = 0;
        let currentQuestion = null;

        let quizResults = [];
        let currentSessionId = null;

        let isDrillDown = false;
        let currentLevel = 0;
        let drillDownLevels = [];
        let drillDownAllCorrect = true;

        // ============================================
        // INITIALISATION
        // ============================================
        async function init() {
            console.log('[QUIZ] Initialisation...');

            const questionsData = sessionStorage.getItem('quizQuestions');
            console.log('[QUIZ] SessionStorage:', questionsData ? 'présent' : 'vide');

            if (!questionsData) {
                console.error('[QUIZ] Erreur: sessionStorage vide');
                alert('Erreur: Aucune question disponible');
                window.location.href = '/quiz-setup';
                return;
            }

            try {
                questions = JSON.parse(questionsData);

                currentSessionId = sessionStorage.getItem('quizSessionId');
                console.log('[QUIZ] Session ID:', currentSessionId);
                console.log('[QUIZ] Questions chargées:', questions.length);

                if (!questions || questions.length === 0) {
                    throw new Error('Liste vide');
                }

                let totalSubQuestions = 0;
                questions.forEach(q => {
                    if (q.type === 'drill_down' && q.levels) {
                        totalSubQuestions += q.levels.length;
                    } else {
                        totalSubQuestions += 1;
                    }
                });

                console.log('[QUIZ] Total:', totalSubQuestions);
                document.getElementById('totalQuestions').textContent = totalSubQuestions;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('quizZone').style.display = 'block';

                loadNextQuestion();
            } catch (error) {
                console.error('[QUIZ] Erreur:', error);
                alert('Erreur parsing: ' + error.message);
                window.location.href = '/quiz-setup';
            }
        }

        // ============================================
        // CHARGEMENT QUESTION
        // ============================================
        function loadNextQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }

            currentQuestion = questions[currentQuestionIndex];
            currentQuestionIndex++;

            isDrillDown = currentQuestion.type === 'drill_down';

            if (isDrillDown) {
                drillDownLevels = currentQuestion.levels;
                currentLevel = 0;
                drillDownAllCorrect = true;
            }

            displayQuestion(currentQuestion);
        }

        // ============================================
        // AFFICHAGE
        // ============================================
        function displayQuestion(question) {
            document.getElementById('currentQuestion').textContent = currentQuestionNum;
            const totalSubQuestions = parseInt(document.getElementById('totalQuestions').textContent);
            const progress = Math.min(100, (currentQuestionNum / totalSubQuestions) * 100);
            document.getElementById('progressBar').style.width = progress + '%';

            document.getElementById('feedback').style.display = 'none';

            const variantDiv = document.getElementById('questionVariant');
            if (question.variant) {
                variantDiv.textContent = question.variant;
                variantDiv.style.display = 'block';
            } else {
                variantDiv.style.display = 'none';
            }

            displayContext(question.context_info);
            displayHand(question.hand);

            if (isDrillDown) {
                displayDrillDownLevel(currentLevel);
            } else {
                document.getElementById('actionSequence').style.display = 'none';
                document.getElementById('situationText').innerHTML = question.question;
                displayActionButtons(question.options);
            }
        }

        function displayDrillDownLevel(levelIndex) {
            const level = drillDownLevels[levelIndex];
            displayDrillDownSequence(levelIndex);
            document.getElementById('situationText').innerHTML = level.question;
            displayActionButtons(level.options);
        }

        function displayContext(context) {
            const badges = [
                { label: '🪑 ' + context.table_format, highlight: false },
                { label: '📍 ' + context.hero_position, highlight: true },
                { label: '💰 ' + context.stack_depth, highlight: false },
                { label: '🎯 ' + context.primary_action, highlight: false }
            ];

            const html = badges.map(b =>
                `<span class="info-badge ${b.highlight ? 'highlight' : ''}">${b.label}</span>`
            ).join('');

            document.getElementById('contextInfo').innerHTML = html;
        }

        function displayActionButtons(options) {
            const container = document.getElementById('actionButtons');
            container.innerHTML = '';

            options.forEach(action => {
                const btn = document.createElement('button');
                let cssClass = action.toLowerCase();
                if (['open', '3bet', '4bet', 'iso', 'raise'].includes(cssClass)) {
                    cssClass = 'raise';
                }

                btn.className = `action-btn btn-${cssClass}`;
                btn.textContent = translateAction(action);
                btn.setAttribute('data-action', action);
                container.appendChild(btn);
            });
        }

        function translateAction(action) {
            const translations = {
                'FOLD': 'Fold',
                'CHECK': 'Check',
                'CALL': 'Call',
                'RAISE': 'Raise',
                'OPEN': 'Raise',
                '3BET': 'Raise',
                '4BET': 'Raise'
            };
            return translations[action] || action;
        }

        function displayDrillDownSequence(currentLevel) {
            const sequenceDiv = document.getElementById('actionSequence');

            if (currentLevel === 0) {
                sequenceDiv.style.display = 'none';
                return;
            }

            const hand = currentQuestion.hand;
            const villainPos = currentQuestion.villain_position || currentQuestion.context_info?.villain_position || "Vilain";
            const primaryAction = currentQuestion.context_info?.primary_action || 'open';

            let narrative = [];

            const firstAction = currentQuestion.sequence[0].action;
            if (primaryAction === 'open') {
                narrative.push(`Vous avez ouvert avec ${hand}`);
            } else if (primaryAction === 'defense') {
                if (firstAction === 'CALL') {
                    narrative.push(`Vous avez callé l'open de ${villainPos} avec ${hand}`);
                } else if (firstAction === 'RAISE' || firstAction === '3BET') {
                    narrative.push(`Vous avez 3bet ${villainPos} avec ${hand}`);
                }
            } else if (primaryAction === 'squeeze') {
                narrative.push(`Vous avez squeezé avec ${hand}`);
            }

            for (let i = 1; i < currentLevel; i++) {
                const level = drillDownLevels[i];
                const villainReaction = level.villain_reaction;
                const heroAction = currentQuestion.sequence[i].action;

                if (villainReaction) {
                    if (villainReaction.action === 'RAISE') {
                        if (villainReaction.sizing === '3bet') {
                            narrative.push(`${villainPos} 3bet`);
                        } else if (villainReaction.sizing === '5bet') {
                            narrative.push(`${villainPos} 5bet`);
                        } else {
                            narrative.push(`${villainPos} relance`);
                        }
                    } else if (villainReaction.action === 'ALL_IN') {
                        narrative.push(`${villainPos} all-in`);
                    }
                }

                if (heroAction === 'RAISE') {
                    narrative.push(`vous sur-relancez`);
                } else if (heroAction === 'CALL') {
                    narrative.push(`vous callez`);
                } else if (heroAction === 'FOLD') {
                    narrative.push(`vous foldez`);
                }
            }

            const narrativeText = narrative.join(', ') + '.';
            sequenceDiv.innerHTML = `<div style="font-size: 0.9rem; color: rgba(240,235,224,0.8); line-height: 1.5;">
                ${narrativeText}
            </div>`;
            sequenceDiv.style.display = 'block';
        }

        // ============================================
        // RÉPONSES
        // ============================================
        function handleAnswer(selectedAction) {
            document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);

            if (isDrillDown) {
                handleDrillDownAnswer(selectedAction);
            } else {
                handleSimpleAnswer(selectedAction);
            }
        }

        async function saveAnswerToDatabase(answerData) {
            if (!currentSessionId) {
                console.warn('[QUIZ] Pas de session_id, skip sauvegarde BDD');
                return;
            }

            try {
                const response = await fetch('/api/quiz/submit-answer', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        ...answerData
                    })
                });

                if (!response.ok) {
                    console.error('[QUIZ] Erreur sauvegarde BDD:', response.status);
                }
            } catch (error) {
                console.error('[QUIZ] Erreur réseau sauvegarde BDD:', error);
            }
        }

        async function handleSimpleAnswer(selectedAction) {
            const isCorrect = selectedAction === currentQuestion.correct_answer;

            quizResults.push({
                hand: currentQuestion.hand,
                context_id: currentQuestion.context_id,
                context_name: currentQuestion.context_info.display_name,
                context_action: currentQuestion.context_info.primary_action,
                hero_position: currentQuestion.context_info.hero_position,
                vs_position: currentQuestion.context_info.vs_position,
                user_answer: selectedAction,
                correct_answer: currentQuestion.correct_answer,
                is_correct: isCorrect,
                question_type: 'simple'
            });

            await saveAnswerToDatabase({
                question_number: currentQuestionNum,
                hand: currentQuestion.hand,
                context_id: currentQuestion.context_id,
                context_name: currentQuestion.context_info.display_name,
                context_action: currentQuestion.context_info.primary_action,
                question_type: 'simple',
                user_answer: selectedAction,
                correct_answer: currentQuestion.correct_answer,
                is_correct: isCorrect
            });

            currentQuestionNum++;
            if (isCorrect) correctAnswers++;

            updateScoreDisplay();
            showFeedback(isCorrect, selectedAction, currentQuestion.correct_answer);
        }

        async function handleDrillDownAnswer(selectedAction) {
            const level = drillDownLevels[currentLevel];
            const isCorrect = selectedAction === level.correct_answer;

            quizResults.push({
                hand: currentQuestion.hand,
                context_id: currentQuestion.context_id,
                context_name: currentQuestion.context_info.display_name,
                context_action: currentQuestion.context_info.primary_action,
                hero_position: currentQuestion.context_info.hero_position,
                vs_position: currentQuestion.context_info.vs_position,
                villain_position: currentQuestion.villain_position,
                user_answer: selectedAction,
                correct_answer: level.correct_answer,
                is_correct: isCorrect,
                question_type: 'drill_down',
                level: currentLevel
            });

            const sequenceHistory = {
                levels: drillDownLevels.slice(0, currentLevel + 1).map((lvl, idx) => ({
                    level: idx,
                    question: lvl.question,
                    villain_reaction: lvl.villain_reaction,
                    hero_action: currentQuestion.sequence[idx]?.action,
                    user_answer: idx === currentLevel ? selectedAction : null
                }))
            };

            await saveAnswerToDatabase({
                question_number: currentQuestionNum,
                hand: currentQuestion.hand,
                context_id: currentQuestion.context_id,
                context_name: currentQuestion.context_info.display_name,
                context_action: currentQuestion.context_info.primary_action,
                question_type: 'drill_down',
                drill_level: currentLevel,
                drill_total_steps: drillDownLevels.length,
                villain_position: currentQuestion.villain_position,
                sequence_history: sequenceHistory,
                user_answer: selectedAction,
                correct_answer: level.correct_answer,
                is_correct: isCorrect
            });

            currentQuestionNum++;

            if (isCorrect) correctAnswers++;

            updateScoreDisplay();

            const totalSubQuestions = parseInt(document.getElementById('totalQuestions').textContent);
            const reachedLimit = currentQuestionNum > totalSubQuestions;

            if (!isCorrect || currentLevel === drillDownLevels.length - 1 || reachedLimit) {
                showFeedback(isCorrect, selectedAction, level.correct_answer, true);
            } else {
                showFeedback(isCorrect, selectedAction, level.correct_answer, false);
            }
        }

        function updateScoreDisplay() {
            document.getElementById('currentQuestion').textContent = currentQuestionNum;
            document.getElementById('correctCount').textContent = correctAnswers;

            const totalSubQuestions = parseInt(document.getElementById('totalQuestions').textContent);
            const progress = Math.min(100, (currentQuestionNum / totalSubQuestions) * 100);
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function showFeedback(isCorrect, selectedAction, correctAnswer, isFinal = true) {
            const feedback = document.getElementById('feedback');
            const title = document.getElementById('feedbackTitle');
            const text = document.getElementById('feedbackText');
            const nextBtn = document.getElementById('nextBtn');

            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');

            if (isCorrect) {
                title.textContent = '✓ Correct !';
                text.textContent = '';

                if (isDrillDown && !isFinal) {
                    nextBtn.textContent = 'Continuer →';
                    nextBtn.onclick = () => {
                        currentLevel++;
                        feedback.style.display = 'none';

                        const totalSubQuestions = parseInt(document.getElementById('totalQuestions').textContent);
                        if (currentQuestionNum > totalSubQuestions) {
                            showResults();
                        } else {
                            displayDrillDownLevel(currentLevel);
                        }
                    };
                } else {
                    nextBtn.textContent = 'Continuer →';
                    nextBtn.onclick = nextQuestion;
                }
            } else {
                title.textContent = '✗ Incorrect';
                text.textContent = `La bonne réponse était : ${translateAction(correctAnswer)}`;
                nextBtn.textContent = 'Continuer →';
                nextBtn.onclick = nextQuestion;
            }

            feedback.style.display = 'block';
        }

        // ============================================
        // NAVIGATION
        // ============================================
        function nextQuestion() {
            const totalSubQuestions = parseInt(document.getElementById('totalQuestions').textContent);

            if (currentQuestionNum > totalSubQuestions) {
                showResults();
                return;
            }

            loadNextQuestion();
        }

        async function showResults() {
            sessionStorage.setItem('quizResults', JSON.stringify(quizResults));

            const quizMetadata = {
                totalQuestions: parseInt(document.getElementById('totalQuestions').textContent),
                correctAnswers: correctAnswers
            };
            sessionStorage.setItem('quizMetadata', JSON.stringify(quizMetadata));

            console.log('[QUIZ] Résultats sauvegardés, fin de session...');

            if (currentSessionId) {
                try {
                    const response = await fetch(`/api/quiz/end-session/${currentSessionId}`, {
                        method: 'POST'
                    });

                    if (response.ok) {
                        const stats = await response.json();
                        console.log('[QUIZ] Session terminée:', stats);
                    }
                } catch (error) {
                    console.error('[QUIZ] Erreur fin de session:', error);
                }
            }

            const redirectUrl = currentSessionId
                ? `/quiz-result?session_id=${currentSessionId}`
                : '/quiz-result';
            window.location.href = redirectUrl;
        }

        function retryQuiz() {
            window.location.href = '/quiz-setup';
        }

        function goHome() {
            window.location.href = '/';
        }

        // ============================================
        // LISTENERS
        // ============================================
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('action-btn')) {
                const action = e.target.getAttribute('data-action');
                if (action && !e.target.disabled) {
                    e.preventDefault();
                    e.stopPropagation();
                    handleAnswer(action);
                }
            }
        }, true);

        // ============================================
        // CARTES CSS
        // ============================================
        const SUITS_BLACK = ['s', 'c'];
        const SUITS_RED   = ['h', 'd'];
        const ALL_SUITS   = [...SUITS_BLACK, ...SUITS_RED];
        const SUIT_SYMBOLS = { s: '♠', h: '♥', d: '♦', c: '♣' };
        const DEAL_MS  = 400;
        const STAGGER  = 150;

        const rand   = (min, max) => Math.random() * (max - min) + min;
        const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];

        function handToCards(handStr) {
            const suited  = /s$/.test(handStr);
            const r1 = handStr[0].toUpperCase();
            const r2 = handStr[1].toUpperCase();

            if (r1 === r2) {
                // Paire : deux couleurs différentes
                const s1 = choice(ALL_SUITS);
                let s2; do { s2 = choice(ALL_SUITS); } while (s2 === s1);
                return [{ rank: r1, suit: s1 }, { rank: r2, suit: s2 }];
            }
            if (suited) {
                const s = choice(ALL_SUITS);
                return [{ rank: r1, suit: s }, { rank: r2, suit: s }];
            }
            // Offsuit : une noire, une rouge
            return [
                { rank: r1, suit: choice(SUITS_BLACK) },
                { rank: r2, suit: choice(SUITS_RED) }
            ];
        }

        function buildCardEl(rank, suit) {
            const sym = SUIT_SYMBOLS[suit];
            const colorClass = SUITS_RED.includes(suit) ? 'card-red' : 'card-black';
            const el = document.createElement('div');
            el.className = `playing-card from-center ${colorClass}`;
            el.style.setProperty('--deal-rot', rand(-5, 5).toFixed(2) + 'deg');
            el.innerHTML = `
                <div class="card-corner">
                    <span class="card-rank">${rank}</span>
                    <span class="card-suit-small">${sym}</span>
                </div>
                <span class="card-center-suit">${sym}</span>
                <div class="card-corner card-corner-bottom">
                    <span class="card-rank">${rank}</span>
                    <span class="card-suit-small">${sym}</span>
                </div>`;
            return el;
        }

        function displayHand(hand) {
            const container = document.getElementById('handDisplay');
            if (!container) return;
            container.innerHTML = '';

            const slot1 = document.createElement('div');
            const slot2 = document.createElement('div');
            slot1.className = 'card-slot';
            slot2.className = 'card-slot';
            container.appendChild(slot1);
            container.appendChild(slot2);

            const cards = handToCards(hand);
            const cRect = container.getBoundingClientRect();
            const targets = [slot1, slot2].map(slot => {
                const r = slot.getBoundingClientRect();
                return { left: r.left - cRect.left, top: r.top - cRect.top };
            });

            cards.forEach(({ rank, suit }, i) => {
                const el = buildCardEl(rank, suit);
                container.appendChild(el);

                setTimeout(() => {
                    el.style.left = targets[i].left + 'px';
                    el.style.top  = targets[i].top  + 'px';
                    el.classList.add('to-slot');
                    setTimeout(() => el.classList.add('arrived'), DEAL_MS);
                }, i * STAGGER);
            });
        }

        // ============================================
        // DÉMARRAGE
        // ============================================
        console.log('🎯 Quiz chargé');
        init();
    </script>
</body>
</html>
